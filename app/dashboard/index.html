<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Animal Adoption Tracker – Dashboard</title>
    <style>
        :root {
            --navy: #0B1F3A;
            --navy2: #16315A;
            --gold: #C9A227;
            --gold-soft: #F3E6B3;
            --ivory: #F6F4EE;
            --ink: #1B2433;
            --muted: #6B7686;
            --ok: #2E7D5B;
            --warn: #D98E04;
            --bad: #B3392F;
            --grey: #8A94A3
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: var(--ivory);
            color: var(--ink)
        }

        header {
            background: var(--navy);
            color: #fff;
            padding: 14px 32px;
            border-bottom: 3px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px
        }

        header h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: 22px;
            color: var(--gold);
            letter-spacing: .3px
        }

        header nav a {
            color: #cdd6e4;
            text-decoration: none;
            margin-left: 18px;
            font-size: 14px;
            padding-bottom: 3px;
            border-bottom: 2px solid transparent
        }

        header nav a:hover {
            color: #fff;
            border-bottom-color: var(--gold)
        }

        main {
            padding: 28px 32px;
            max-width: 1300px;
            margin: 0 auto
        }

        .bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px
        }

        .bar h2 {
            margin: 0;
            font-family: Georgia, serif;
            color: var(--navy)
        }

        .bar small {
            color: var(--muted)
        }

        button {
            background: var(--navy);
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 9px 16px;
            cursor: pointer;
            font-size: 14px
        }

        button:hover {
            background: var(--navy2)
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 22px
        }

        .kpi {
            background: #fff;
            border-radius: 14px;
            padding: 18px 20px;
            box-shadow: 0 2px 10px rgba(11, 31, 58, .07);
            border-top: 4px solid var(--gold)
        }

        .kpi .l {
            font-size: 13px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .6px
        }

        .kpi .v {
            font-size: 40px;
            font-weight: 700;
            color: var(--navy);
            margin-top: 6px;
            font-family: Georgia, serif
        }

        .kpi.warn {
            border-top-color: var(--bad)
        }

        .kpi.warn .v {
            color: var(--bad)
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 18px
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 20px 22px;
            box-shadow: 0 2px 10px rgba(11, 31, 58, .07)
        }

        .card h3 {
            margin: 0 0 14px;
            color: var(--navy);
            font-size: 16px;
            border-bottom: 2px solid var(--gold-soft);
            padding-bottom: 8px
        }

        .row {
            display: grid;
            grid-template-columns: 130px 1fr 60px;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            font-size: 14px
        }

        .track {
            background: #EEF1F6;
            border-radius: 99px;
            height: 14px;
            overflow: hidden
        }

        .fill {
            height: 100%;
            border-radius: 99px;
            transition: width .6s
        }

        .num {
            text-align: right;
            font-weight: 600;
            color: var(--navy)
        }

        .occ {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 10px;
            align-items: center;
            margin: 12px 0;
            font-size: 14px
        }

        .occ small {
            color: var(--muted);
            display: block
        }

        .err {
            background: #fdecea;
            color: var(--bad);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: none
        }

        .empty {
            color: var(--muted);
            font-size: 14px;
            padding: 12px 0
        }

        svg text {
            font-size: 11px;
            fill: #6B7686
        }
    </style>
</head>

<body>
    <header>
        <h1>🐾 Animal Adoption Tracker · Admin</h1>
        <nav>
            <a href="/landing/index.html">Home</a>
            <a href="/aat.admin.animals/index.html">Animals</a>
            <a href="/aat.admin.shelters/index.html">Shelters</a>
            <a href="/aat.admin.applications/index.html">Applications</a>
            <a href="/aat.admin.health/index.html">Health</a>
            <a href="/aat.admin.adoptions/index.html">Adoptions</a>
            <a href="/aat.admin.inspections/index.html">Inspections</a>
            <a href="/aat.admin.users/index.html">Users</a>
            <a href="/aat.admin.auditlog/index.html">Audit log</a>
        </nav>
    </header>
    <main>
        <div class="err" id="err"></div>
        <div class="bar">
            <h2>Dashboard</h2>
            <div><small id="stamp"></small> &nbsp; <button id="refresh">Refresh</button></div>
        </div>

        <section class="kpis" id="kpis"></section>

        <section class="grid">
            <div class="card">
                <h3>Applications by status</h3>
                <div id="status"></div>
            </div>
            <div class="card">
                <h3>Adoptions over the last 6 months</h3>
                <div id="trend"></div>
            </div>
            <div class="card" style="grid-column:1/-1">
                <h3>Shelter occupancy</h3>
                <div id="occ"></div>
            </div>
        </section>
    </main>

    <script>
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        async function api(path) {
            const r = await fetch('/odata/v4/admin/' + path, { headers: { Accept: 'application/json' } });
            if (!r.ok) throw new Error('Request failed (' + r.status + '). Are you logged in as the Admin?');
            return r.json();
        }

        function kpi(label, value, cls) {
            return `<div class="kpi ${cls || ''}"><div class="l">${label}</div><div class="v">${value}</div></div>`;
        }

        function statusBars(list) {
            const colors = { 'Submitted': '#C9A227', 'Under Review': '#16315A', 'Approved': '#2E7D5B', 'Rejected': '#B3392F', 'Withdrawn': '#8A94A3' };
            const max = Math.max(1, ...list.map(x => x.count));
            $('status').innerHTML = list.map(x => `
    <div class="row"><span>${esc(x.status)}</span>
      <div class="track"><div class="fill" style="width:${(x.count / max) * 100}%;background:${colors[x.status] || '#16315A'}"></div></div>
      <span class="num">${x.count}</span></div>`).join('');
        }

        function trendChart(rows) {
            const months = [];
            const now = new Date();
            for (let i = 5; i >= 0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                months.push({
                    key: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'),
                    label: d.toLocaleString(undefined, { month: 'short' })
                });
            }
            const map = Object.fromEntries(rows.map(r => [r.period, r.count]));
            const vals = months.map(m => map[m.key] || 0);
            const W = 560, H = 210, P = 34, max = Math.max(2, ...vals);
            const x = i => P + i * (W - 2 * P) / (months.length - 1);
            const y = v => H - P - (v / max) * (H - 2 * P);
            const grid = Array.from({ length: max + 1 }, (_, v) => v)
                .map(v => `<line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" stroke="#E3E7EE"/><text x="${P - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('');
            const pts = vals.map((v, i) => `${x(i)},${y(v)}`).join(' ');
            const dots = vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="#C9A227" stroke="#0B1F3A" stroke-width="2"/>
      <text x="${x(i)}" y="${y(v) - 10}" text-anchor="middle" style="fill:#0B1F3A;font-weight:600">${v}</text>
      <text x="${x(i)}" y="${H - 10}" text-anchor="middle">${months[i].label}</text>`).join('');
            $('trend').innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%">${grid}
      <polyline points="${pts}" fill="none" stroke="#0B1F3A" stroke-width="3" stroke-linejoin="round"/>${dots}</svg>`;
        }

        function occupancy(list) {
            if (!list.length) { $('occ').innerHTML = '<div class="empty">No shelters yet.</div>'; return; }
            $('occ').innerHTML = list.map(s => {
                const pct = Number(s.occupancyPct) || 0;
                const color = pct >= 90 ? '#B3392F' : pct >= 70 ? '#D98E04' : '#2E7D5B';
                return `<div class="occ"><div>${esc(s.shelterName)}<small>${esc(s.location || '')} · ${s.currentOccupancy} of ${s.totalCapacity} places</small></div>
      <div style="display:flex;align-items:center;gap:10px"><div class="track" style="flex:1"><div class="fill" style="width:${Math.min(pct, 100)}%;background:${color}"></div></div><b>${pct.toFixed(0)}%</b></div></div>`;
            }).join('');
        }

        async function load() {
            $('err').style.display = 'none';
            try {
                const s = await api('getAnimalSummary()');                 // first call alone, so the login prompt shows once
                const [d, t, o, od, pc] = await Promise.all([
                    api('getApplicationStatusDistribution()'), api('getAdoptionTrend(months=6)'),
                    api('getShelterOccupancy()'), api('getOverdueCheckups()'), api('getPendingCounts()')]);
                $('kpis').innerHTML =
                    kpi('Total animals', s.totalAnimals) + kpi('Available', s.available) +
                    kpi('Adopted', s.adopted) + kpi('Reserved / treatment', s.unavailable) +
                    kpi('Pending applications', pc.pendingApplications) + kpi('Pending inspections', pc.pendingInspections) +
                    kpi('Overdue checkups', od.value.length, od.value.length ? 'warn' : '');
                statusBars(d.value); trendChart(t.value); occupancy(o.value);
                $('stamp').textContent = 'Updated ' + new Date().toLocaleTimeString();
            } catch (e) {
                $('err').textContent = e.message; $('err').style.display = 'block';
            }
        }
        $('refresh').onclick = load;
        load();
    </script>
    <script src="/shared/i18n.js"></script>
    <script src="/shared/session-bar.js"></script>
</body>

</html>
