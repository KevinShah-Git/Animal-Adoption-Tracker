_schema-version: 3.3.0
ID: animal-adoption-tracker
version: 1.0.0
description: "A simple CAP project."

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: animal-adoption-tracker-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack

    build-parameters:
      builder: npm-ci

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

    requires:
      - name: animal-adoption-tracker-auth
      - name: animal-adoption-tracker-db
      - name: cloudinary-credentials

  - name: animal-adoption-tracker-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack

    requires:
      - name: animal-adoption-tracker-db

  - name: animal-adoption-tracker
    type: approuter.nodejs
    path: .deploy/app-router

    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M

    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

      - name: animal-adoption-tracker-auth
      - name: animal-adoption-tracker-html5-runtime

    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: animal-adoption-tracker-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: animal-adoption-tracker-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api

  - name: animal-adoption-tracker-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: animal-adoption-tracker-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: animal-adoption-tracker-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  # Cloudinary User Provided Service
  - name: cloudinary-credentials
    type: org.cloudfoundry.existing-service

